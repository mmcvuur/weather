<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Sun & Rays -->
  <g filter="url(#shadow)">
    <!-- Sun Rays -->
    <g stroke="#ffbd2e" stroke-width="20" stroke-linecap="round">
      <line x1="310" y1="120" x2="310" y2="80" />
      <line x1="380" y1="150" x2="410" y2="120" />
      <line x1="410" y1="220" x2="450" y2="220" />
      <line x1="380" y1="290" x2="410" y2="320" />
      <line x1="240" y1="150" x2="210" y2="120" />
    </g>
    <!-- Sun Body -->
    <circle cx="310" cy="220" r="85" fill="url(#sunGlow)" />
  </g>

  <!-- Front Cloud -->
  <g filter="url(#shadow)">
    <path d="M 160 380 
             L 370 380 
             A 60 60 0 0 0 370 260 
             A 75 75 0 0 0 240 210 
             A 65 65 0 0 0 140 280 
             A 55 55 0 0 0 160 380 Z" 
          fill="url(#cloudGrad)" />
  </g>
</svg>
